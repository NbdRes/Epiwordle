<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CIIP Epigraphic Wordle</title>
  <style>
    /* ==========================================
       1. עיצוב כללי (CSS)
       ========================================== */
    :root {
      --bg-color: #121213;
      --tile-border: #3a3a3c;
      --key-bg: #818384;
      --correct: #538d4e; /* ירוק - אות במיקום הנכון */
      --present: #b59f3b; /* צהוב - אות קיימת במיקום אחר */
      --absent: #3a3a3c;  /* אפור - אות לא קיימת במילה */
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 15px;
      min-height: 100vh;
      box-sizing: border-box;
    }

    header {
      text-align: center;
      border-bottom: 1px solid var(--tile-border);
      padding-bottom: 10px;
      margin-bottom: 12px;
      width: 100%;
      max-width: 500px;
    }

    h1 {
      margin: 0 0 6px 0;
      font-size: 1.6rem;
      letter-spacing: 2px;
      direction: ltr;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      font-size: 0.9rem;
      color: #ccc;
    }

    select, button.new-game-btn {
      background: #272729;
      color: #fff;
      border: 1px solid #565758;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    button.new-game-btn:hover {
      background: #3a3a3c;
    }

    /* הודעות מערכת ותיבת מידע אפיגרפי */
    #message {
      min-height: 24px;
      margin-bottom: 8px;
      font-weight: bold;
      color: #f5793a;
      text-align: center;
    }

    #epigraphic-info {
      display: none;
      background-color: #1e1e20;
      border: 1px solid #538d4e;
      border-radius: 6px;
      padding: 10px 14px;
      margin-bottom: 15px;
      max-width: 480px;
      width: 100%;
      font-size: 0.9rem;
      line-height: 1.4;
      direction: ltr;
      text-align: left;
    }

    #epigraphic-info strong {
      color: #6aaa64;
    }

    /* לוח המשחק (6 שורות של 5 אותיות משמאל לימין) */
    #board {
      display: grid;
      grid-template-rows: repeat(6, 1fr);
      gap: 5px;
      margin-bottom: 20px;
      direction: ltr; /* יוונית נכתבת משמאל לימין */
    }

    .row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
    }

    .tile {
      width: 54px;
      height: 54px;
      border: 2px solid var(--tile-border);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.9rem;
      font-weight: bold;
      user-select: none;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .tile.correct { background-color: var(--correct); border-color: var(--correct); }
    .tile.present { background-color: var(--present); border-color: var(--present); }
    .tile.absent  { background-color: var(--absent);  border-color: var(--absent); }

    /* מקלדת יוונית וירטואלית */
    #keyboard {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: 500px;
      width: 100%;
      direction: ltr;
    }

    .kb-row {
      display: flex;
      justify-content: center;
      gap: 5px;
    }

    .key {
      background-color: var(--key-bg);
      color: white;
      border: none;
      border-radius: 4px;
      height: 48px;
      flex: 1;
      max-width: 44px;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
    }

    .key.wide {
      max-width: 68px;
      font-size: 0.85rem;
    }

    .key.correct { background-color: var(--correct); }
    .key.present { background-color: var(--present); }
    .key.absent  { background-color: var(--absent); }
  </style>
</head>

      "ΧΩΡΑΝ": { count: 1, id: "1197", text: "[τύποι] δοθέντε[ς κατὰ τὰ θεῖα διατάγματα...]" }
    };

    // =========================================================
    // 3. משתני מצב המשחק (Game State)
    // =========================================================
    const WORD_LENGTH = 5;
    const MAX_GUESSES = 6;
    let secretWord = "";
    let currentRow = 0;
    let currentGuess = "";
    let isGameOver = false;

    // פריסת מקלדת יוונית תקנית (24 אותיות)
    const GREEK_KEYS = [
      ["Ε", "Ρ", "Τ", "Υ", "Θ", "Ι", "Ο", "Π"],
      ["Α", "Σ", "Δ", "Φ", "Γ", "Η", "Ξ", "Κ", "Λ"],
      ["ENTER", "Ζ", "Χ", "Ψ", "Ω", "Β", "Ν", "Μ", "⌫"]
    ];

    // מיפוי מקלדת פיזית (למי שמקליד במקלדת אנגלית/עברית או יוונית)
    const LATIN_TO_GREEK = {
      'A':'Α', 'B':'Β', 'G':'Γ', 'D':'Δ', 'E':'Ε', 'Z':'Ζ', 'H':'Η', 'U':'Θ',
      'I':'Ι', 'K':'Κ', 'L':'Λ', 'M':'Μ', 'N':'Ν', 'J':'Ξ', 'O':'Ο', 'P':'Π',
      'R':'Ρ', 'S':'Σ', 'W':'Σ', 'T':'Τ', 'Y':'Υ', 'F':'Φ', 'X':'Χ', 'C':'Ψ', 'V':'Ω'
    };

    // =========================================================
    // 4. אתחול המשחק ובניית הלוח והמקלדת
    // =========================================================
    function initGame() {
      const mode = document.getElementById("mode-select").value;
      const allWords = Object.keys(EPIGRAPHIC_DB);
      
      // סינון מילים לפי בחירת המשתמש (נפוצות >= 2 או כל המאגר)
      const candidatePool = (mode === "frequent")
        ? allWords.filter(w => EPIGRAPHIC_DB[w].count >= 2)
        : allWords;

      secretWord = candidatePool[Math.floor(Math.random() * candidatePool.length)];
      currentRow = 0;
      currentGuess = "";
      isGameOver = false;

      showMessage("");
      const infoBox = document.getElementById("epigraphic-info");
      infoBox.style.display = "none";
      infoBox.innerHTML = "";

      buildBoard();
      buildKeyboard();
    }

    function buildBoard() {
      const board = document.getElementById("board");
      board.innerHTML = "";
      for (let r = 0; r < MAX_GUESSES; r++) {
        const row = document.createElement("div");
        row.className = "row";
        for (let c = 0; c < WORD_LENGTH; c++) {
          const tile = document.createElement("div");
          tile.className = "tile";
          tile.id = `tile-${r}-${c}`;
          row.appendChild(tile);
        }
        board.appendChild(row);
      }
    }

    function buildKeyboard() {
      const keyboard = document.getElementById("keyboard");
      keyboard.innerHTML = "";
      GREEK_KEYS.forEach(rowKeys => {
        const kbRow = document.createElement("div");
        kbRow.className = "kb-row";
        rowKeys.forEach(k => {
          const btn = document.createElement("button");
          btn.className = "key" + (k.length > 1 ? " wide" : "");
          btn.textContent = k;
          btn.id = `key-${k}`;
          btn.onclick = () => handleInput(k);
          kbRow.appendChild(btn);
        });
        keyboard.appendChild(kbRow);
      });
    }

    // =========================================================
    // 5. ניהול קלט ובדיקת ניחושים
    // =========================================================
    function handleInput(key) {
      if (isGameOver) return;
      showMessage("");

      if (key === "⌫" || key === "BACKSPACE") {
        currentGuess = currentGuess.slice(0, -1);
        updateGrid();
      } else if (key === "ENTER") {
        if (currentGuess.length < WORD_LENGTH) {
          showMessage("המילה קצרה מדי (נדרשות 5 אותיות)");
          return;
        }
        submitGuess();
      } else if (currentGuess.length < WORD_LENGTH && /^[Α-Ω]$/.test(key)) {
        currentGuess += key;
        updateGrid();
      }
    }

    function updateGrid() {
      for (let c = 0; c < WORD_LENGTH; c++) {
        const tile = document.getElementById(`tile-${currentRow}-${c}`);
        tile.textContent = currentGuess[c] || "";
      }
    }

    function submitGuess() {
      let secretChars = secretWord.split("");
      let guessChars = currentGuess.split("");
      let statuses = Array(WORD_LENGTH).fill("absent");

      // מעבר ראשון: איתור פגיעות מדויקות (ירוק - correct)
      for (let i = 0; i < WORD_LENGTH; i++) {
        if (guessChars[i] === secretChars[i]) {
          statuses[i] = "correct";
          secretChars[i] = null;
        }
      }

      // מעבר שני: איתור אותיות קיימות במיקום שגוי (צהוב - present)
      for (let i = 0; i < WORD_LENGTH; i++) {
        if (statuses[i] === "correct") continue;
        const indexInSecret = secretChars.indexOf(guessChars[i]);
        if (indexInSecret !== -1) {
          statuses[i] = "present";
          secretChars[indexInSecret] = null;
        }
      }

      // צביעת המשבצות והמקלדת
      for (let i = 0; i < WORD_LENGTH; i++) {
        const tile = document.getElementById(`tile-${currentRow}-${i}`);
        tile.classList.add(statuses[i]);

        const keyBtn = document.getElementById(`key-${guessChars[i]}`);
        if (keyBtn) {
          if (statuses[i] === "correct") {
            keyBtn.className = "key correct";
          } else if (statuses[i] === "present" && !keyBtn.classList.contains("correct")) {
            keyBtn.className = "key present";
          } else if (statuses[i] === "absent" && !keyBtn.classList.contains("correct") && !keyBtn.classList.contains("present")) {
            keyBtn.className = "key absent";
          }
        }
      }

      // בדיקת סיום משחק (ניצחון או הפסד) והצגת מידע אפיגרפי
      if (currentGuess === secretWord) {
        showMessage("ניצחת! 🎉");
        isGameOver = true;
        showEpigraphicContext();
      } else if (currentRow === MAX_GUESSES - 1) {
        showMessage(`המשחק נגמר! המילה הייתה: ${secretWord}`);
        isGameOver = true;
        showEpigraphicContext();
      } else {
        currentRow++;
        currentGuess = "";
      }
    }

    function showEpigraphicContext() {
      const entry = EPIGRAPHIC_DB[secretWord];
      if (!entry) return;
      const infoBox = document.getElementById("epigraphic-info");
      infoBox.style.display = "block";
      infoBox.innerHTML = `
        <div><strong>Word:</strong> ${secretWord} (Frequency in corpus: ${entry.count})</div>
        <div><strong>CIIP Inscription ID:</strong> ${entry.id}</div>
        <div style="margin-top:4px;"><strong>Text:</strong> <em>${entry.text}</em></div>
      `;
    }

    function showMessage(msg) {
      document.getElementById("message").textContent = msg;
    }

    // האזנה למקלדת פיזית (תומך ביוונית ובמיפוי מקשים באנגלית)
    document.addEventListener("keydown", (e) => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      let key = e.key.toUpperCase();
      if (key === "ς" || key === "Ϲ") key = "Σ";
      if (LATIN_TO_GREEK[key]) key = LATIN_TO_GREEK[key];
      handleInput(key);
    });

    // הפעלת המשחק בטעינה ראשונית
    initGame();
  </script>
